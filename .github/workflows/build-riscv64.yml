name: Build riscv64 wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to build from'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    # The build job only reads the repo, fetches an upstream tag and uploads
    # an artifact. It never writes back. The release job below is the only
    # writer and inherits the workflow-default token permissions.
    permissions:
      contents: read
    steps:
      # Check out the fork (default branch) with submodules. When a specific
      # upstream release tag is requested, fetch that tag from upstream and
      # check it out in place. We deliberately do not push the upstream tag
      # to the fork: the GITHUB_TOKEN is not allowed to write files under
      # .github/workflows/, and upstream release tags carry their own
      # workflow files, so the push is rejected. Building from the tag in
      # the working tree avoids that entirely.
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Check out upstream release tag
        if: ${{ inputs.release_tag != '' }}
        env:
          TAG: ${{ inputs.release_tag }}
          UPSTREAM: https://github.com/MagicStack/httptools.git
        run: |
          set -euo pipefail
          # Reject anything that is not a plain tag name (no leading '-', no
          # whitespace or shell/git option characters) so the value can never
          # be parsed as a git option such as --upload-pack=...
          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9._/-]+$' \
              || printf '%s' "${TAG}" | grep -Eq '^-'; then
            echo "Refusing suspicious release_tag: ${TAG}" >&2
            exit 1
          fi
          git remote add upstream "${UPSTREAM}"
          # '--' terminates option parsing; the tag can only be read as a ref.
          git fetch upstream tag "${TAG}"
          git checkout --detach "refs/tags/${TAG}" --
          # Pick up any submodule URL changes the upstream tag introduced.
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "Building from upstream tag ${TAG}."

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: |
          uvx --python 3.14 --with setuptools --with wheel --with cython pip wheel . --no-deps --wheel-dir /tmp/wheels/

      - name: Verify platform tag
        run: |
          ls /tmp/wheels/*.whl
          for whl in /tmp/wheels/*.whl; do
            if echo "$whl" | grep -q "linux_riscv64\|manylinux.*riscv64"; then
              echo "OK: $whl"
            else
              echo "FAIL: $whl does not have riscv64 platform tag"
              exit 1
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/*.whl
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/build-venv /tmp/wheels

  release:
    needs: build
    runs-on: ubuntu-24.04-riscv
    if: success()
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/

      - name: Get wheel info
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/*.whl | head -1)
          BASENAME=$(basename "$WHL")
          VERSION=$(echo "$BASENAME" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          echo "whl_path=$WHL" >> "$GITHUB_OUTPUT"
          echo "whl_name=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd /tmp/wheels
          sha256sum *.whl > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="riscv64-v${{ steps.wheel_info.outputs.version }}"
          TITLE="riscv64 wheel v${{ steps.wheel_info.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Prebuilt riscv64 wheel.

          Built on: RISE riscv64 runner (ubuntu-24.04-riscv)
          Wheel: ${{ steps.wheel_info.outputs.whl_name }}

          Install:
          \`\`\`
          pip install httptools --extra-index-url https://gounthar.github.io/riscv64-python-wheels/simple/
          \`\`\`" \
            /tmp/wheels/*.whl \
            /tmp/wheels/SHA256SUMS

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels
