name: Build riscv64 wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to build from'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: |
          uv venv /tmp/build-venv
          . /tmp/build-venv/bin/activate
          uv pip install setuptools wheel cython
          uv pip wheel . --no-deps --wheel-dir /tmp/wheels/

      - name: Verify platform tag
        run: |
          ls /tmp/wheels/*.whl
          for whl in /tmp/wheels/*.whl; do
            if echo "$whl" | grep -q "linux_riscv64\|manylinux.*riscv64"; then
              echo "OK: $whl"
            else
              echo "FAIL: $whl does not have riscv64 platform tag"
              exit 1
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/*.whl
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/build-venv /tmp/wheels

  release:
    needs: build
    runs-on: ubuntu-24.04-riscv
    if: success()
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/

      - name: Get wheel info
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/*.whl | head -1)
          BASENAME=$(basename "$WHL")
          VERSION=$(echo "$BASENAME" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          echo "whl_path=$WHL" >> "$GITHUB_OUTPUT"
          echo "whl_name=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd /tmp/wheels
          sha256sum *.whl > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="riscv64-v${{ steps.wheel_info.outputs.version }}"
          TITLE="riscv64 wheel v${{ steps.wheel_info.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Prebuilt riscv64 wheel.

          Built on: RISE riscv64 runner (ubuntu-24.04-riscv)
          Wheel: ${{ steps.wheel_info.outputs.whl_name }}

          Install:
          \`\`\`
          pip install httptools --extra-index-url https://gounthar.github.io/riscv64-python-wheels/simple/
          \`\`\`" \
            /tmp/wheels/*.whl \
            /tmp/wheels/SHA256SUMS

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels
